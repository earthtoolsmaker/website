stats:
  - value: "10+"
    label: "species monitored"

# Newest year first. The first entry is shown as "this year"; the two most
# recent years are shown, older ones fold behind a "Show" button.
timeline:
  - year: "2026"
    title: "From research to platforms"
    items:
      - tag: "Seabirds"
        text: "Funded and shipped: AI-BIRD, built with Lumax AI and Sovon, surveys seabird colonies from drone flights to track avian influenza."
        link: "/tools/ai-bird/"
        link_label: "AI-BIRD"
      - tag: "Coasts"
        text: "Drone monitoring of erosion and land cover on the Wadden Sea for Rijkswaterstaat."
        link: "/projects/coastal_erosion_monitoring/"
      - tag: "Wildfire"
        text: "28 research papers raced head to head became Pyronear's production smoke verifier, with 4× fewer false alarms."
        link: "/projects/early_forest_fire_detection/"
      - tag: "Salmon"
        text: "Sonar counts smolt runs no camera could see."
        link: "/projects/monitoring_smolt_salmon_migration_with_sonar/"
  - year: "2025"
    title: "Tools others can run"
    items:
      - tag: "Camera traps"
        text: "BioWatch turns camera-trap archives into maps and insights."
      - tag: "Seals"
        text: "Seal surveys take off over the Wadden Sea."
      - tag: "Snow leopards"
        text: "Snow leopard monitoring begins in the mountains of Central Asia."
  - year: "2024"
    title: "First field deployments"
    items:
      - tag: "Coral reefs"
        text: "Coral reef health monitoring."
      - tag: "Elephants"
        text: "Forest elephant acoustics with Cornell."
      - tag: "Bears"
        text: "Bear identification."
      - tag: "Salmon"
        text: "SalmonVision starts counting fish on British Columbia rivers."

# Logos in the About "Trusted by" row. Names must match params.partner_item
# names in config.toml exactly; the build warns about any that don't.
trusted_by:
  - "Pyronear"
  - "Wild Salmon Center"
  - "Pacific Salmon Foundation"
  - "Cornell Lab of Ornithology"
  - "Sovon"
  - "EarthRanger"
  - "Foundation Conservation Carpathia"
