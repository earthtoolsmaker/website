steps:
  - title: "Start from the field problem"
    description: "We sit down with the people collecting the data: what they record, where, and what decision it should feed."

  - title: "Build on the best research"
    description: "We start from published methods and models, adapt them to your species, sites and sensors, or train new ones on your data."

  - title: "Deploy where the data is"
    description: "A camera on a riverbank, a server in a ranger station, or the cloud: systems built for the power and connectivity you actually have."

  - title: "Keep it running"
    description: "Monitoring, retraining and support season after season, so the system still works when conditions change."

proof:
  - tag: "Wildfire"
    title: "28 papers in, one smoke verifier out"
    featured: true
    research: "We surveyed the literature, raced 28 published methods head to head on a shared leaderboard, and shipped the winner."
    field: "Watching the forest 24/7 from 50+ camera stations: 500+ wildfires detected in real time, with 4× fewer false alarms and smoke spotted up to 35 km away."
    link: "/projects/early_forest_fire_detection/"
    image: "/images/projects/early_forest_fire_detection/cover.jpg"

  - tag: "Seabirds"
