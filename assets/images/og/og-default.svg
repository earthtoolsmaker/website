<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="Mulish, Helvetica, Arial, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#e3f0ee"/></linearGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="9" stdDeviation="18" flood-color="#1c2b28" flood-opacity="0.13"/></filter>
  <style>
    .brand { font-family: Newsreader, Georgia, 'Times New Roman', serif; font-size: 64px; font-weight: 600; fill: #1f2a3a; }
    .h1    { font-family: Newsreader, Georgia, 'Times New Roman', serif; font-size: 50px; font-weight: 500; fill: #161616; }
    .hl    { font-style: italic; fill: #006d77; }
    .url   { font-size: 24px; font-weight: 800; letter-spacing: 0.04em; fill: #60626a; }
  </style>
</defs>

<rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>

<!-- etm icon -->
<g filter="url(#soft)"><circle cx="300" cy="315" r="190" fill="#ffffff" stroke="#d6e7e4" stroke-width="3"/></g>
<image href="../logos/etm-logo.png" xlink:href="../logos/etm-logo.png" x="150" y="170" width="300" height="291"/>

<!-- wording -->
<text class="brand" x="560" y="238">earthtoolsmaker</text>
<text class="h1" x="560" y="330">We build tools and</text>
<text class="h1" x="560" y="392">platforms <tspan class="hl">for conservation</tspan>.</text>
<text class="url" x="562" y="474">earthtoolsmaker.org</text>
</svg>
