<svg viewBox="0 0 1062 380" xmlns="http://www.w3.org/2000/svg" font-family="Mulish, Helvetica, Arial, sans-serif">
<defs>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c4e6ef"/><stop offset="100%" stop-color="#9ed2dc"/></linearGradient>
  <linearGradient id="mud" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e6d3b3"/><stop offset="100%" stop-color="#d4b98e"/></linearGradient>
  <linearGradient id="marsh" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#88c8b9"/><stop offset="100%" stop-color="#4f9e8e"/></linearGradient>
  <linearGradient id="dem" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#cfe9e0"/><stop offset="55%" stop-color="#83c5be"/><stop offset="100%" stop-color="#006d77"/></linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 1 L9 5 L0 9 Z" fill="#e29578"/>
  </marker>
  <filter id="cardshadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#1c2b28" flood-opacity="0.08"/>
  </filter>
  <style>
    .title { font-family: Newsreader, Georgia, 'Times New Roman', serif; font-size: 26px; font-weight: 600; fill: #161616; }
    .desc  { font-size: 15px; fill: #60626a; }
    .step  { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; fill: #e29578; }
    .chip  { font-size: 11px; font-weight: 700; fill: #fbf6f6; }

    .drone { animation: bob 2.6s ease-in-out infinite; }
    .rotor { animation: spin 0.5s linear infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    .ray   { animation: pulse 2.4s ease-in-out infinite; }
    .ray.r2 { animation-delay: -0.8s; } .ray.r3 { animation-delay: -1.6s; }
    .water { stroke-dasharray: 2 9; animation: flow 1.1s linear infinite; }
    .layer   { animation: float 3.6s ease-in-out infinite; }
    .layer.l2 { animation-delay: -1.2s; } .layer.l3 { animation-delay: -2.4s; }
    .scan  { animation: sweep 2.8s ease-in-out infinite; }
    .patch { animation: pop 2.8s ease-in-out infinite; }
    .patch.p2 { animation-delay: -0.5s; } .patch.p3 { animation-delay: -1.0s; }
    .patch.p4 { animation-delay: -1.5s; } .patch.p5 { animation-delay: -2.0s; }
    .after  { animation: fadeAB 4.2s ease-in-out infinite; }
    .swipe  { animation: sweepAB 4.2s ease-in-out infinite; }

    @keyframes bob   { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
    @keyframes spin  { 0%,100%{transform:scaleX(1)} 50%{transform:scaleX(0.25)} }
    @keyframes pulse { 0%,100%{opacity:0.2} 50%{opacity:1} }
    @keyframes flow  { to { stroke-dashoffset: -22; } }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
    @keyframes sweep { 0%,100%{transform:translateX(-58px)} 50%{transform:translateX(58px)} }
    @keyframes pop   { 0%,100%{opacity:0.45} 50%{opacity:1} }
    @keyframes fadeAB  { 0%,100%{opacity:0} 45%,55%{opacity:1} }
    @keyframes sweepAB { 0%,100%{transform:translateX(-42px)} 45%,55%{transform:translateX(42px)} }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</defs>

<!-- ============ CONNECTOR ARROWS ============ -->
<g stroke="#e29578" stroke-width="3.5" fill="none" stroke-linecap="round">
  <line x1="250" y1="134" x2="291" y2="134" marker-end="url(#arrow)"/>
  <line x1="509" y1="134" x2="550" y2="134" marker-end="url(#arrow)"/>
  <line x1="768" y1="134" x2="809" y2="134" marker-end="url(#arrow)"/>
</g>

<!-- ============ CARD 1 — FLY (cx=142) ============ -->
<rect x="36" y="28" width="212" height="212" rx="20" fill="#fbf6f6" stroke="#ede0d4" stroke-width="2" filter="url(#cardshadow)"/>
<g transform="translate(142,128)">
  <clipPath id="clip1"><rect x="-90" y="-78" width="180" height="156" rx="8"/></clipPath>
  <g clip-path="url(#clip1)">
    <!-- sea / mudflat / marsh / dike, diagonal like the real coast -->
    <rect x="-90" y="-78" width="180" height="156" fill="url(#sea)"/>
    <path d="M-90 10 L90 -28 L90 40 L-90 66 Z" fill="url(#mud)"/>
    <path d="M-90 66 L90 40 L90 58 L-90 82 Z" fill="url(#marsh)"/>
    <path d="M-90 82 L90 58 L90 66 L-90 90 Z" fill="#15463f"/>
    <rect x="-90" y="62" width="180" height="30" transform="rotate(-8)" fill="none"/>
    <!-- marsh tufts on the mudflat -->
    <g fill="#4f9e8e">
      <ellipse cx="-52" cy="52" rx="9" ry="4"/><ellipse cx="-20" cy="48" rx="7" ry="3"/>
      <ellipse cx="18" cy="40" rx="10" ry="4"/><ellipse cx="52" cy="34" rx="6" ry="3"/>
    </g>
    <!-- flowing water texture -->
    <g stroke="#f4fbfa" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8">
      <path class="water" d="M-80 -58 C -40 -64 20 -52 82 -60"/>
      <path class="water" d="M-84 -34 C -30 -42 30 -30 84 -40"/>
    </g>
  </g>
  <!-- survey drone -->
  <g class="drone">
    <g transform="translate(0,-14)">
      <rect x="-16" y="-6" width="32" height="12" rx="5" fill="#006d77"/>
      <circle cx="0" cy="4" r="5" fill="#15463f"/><circle cx="0" cy="4" r="2.4" fill="#83c5be"/>
      <g stroke="#15463f" stroke-width="3.5" stroke-linecap="round"><path d="M-14 -4 L-32 -14"/><path d="M14 -4 L32 -14"/></g>
      <ellipse class="rotor" cx="-32" cy="-16" rx="13" ry="3" fill="#3a8576"/>
      <ellipse class="rotor" cx="32" cy="-16" rx="13" ry="3" fill="#3a8576"/>
    </g>
  </g>
  <!-- camera sightlines sweeping the shore -->
  <g stroke="#e29578" stroke-width="3" stroke-linecap="round">
    <path class="ray r1" d="M-6 -2 L-38 40"/>
    <path class="ray r2" d="M0 -2 L0 44"/>
    <path class="ray r3" d="M6 -2 L38 36"/>
  </g>
</g>
<text class="step" x="142" y="280" text-anchor="middle">01</text>
<text class="title" x="142" y="312" text-anchor="middle">Fly</text>
<text class="desc"  x="142" y="338" text-anchor="middle">Drones survey the coast</text>

<!-- ============ CARD 2 — MAP (cx=401) ============ -->
<rect x="295" y="28" width="212" height="212" rx="20" fill="#fbf6f6" stroke="#ede0d4" stroke-width="2" filter="url(#cardshadow)"/>
<g transform="translate(401,128)">
  <!-- three stacked survey layers: grid, elevation, orthophoto -->
  <g transform="translate(0,34)"><g class="layer l3">
    <path d="M-62 0 L0 -26 L62 0 L0 26 Z" fill="#fbf6f6" stroke="#9ad2c4" stroke-width="2"/>
    <g stroke="#9ad2c4" stroke-width="1.6">
      <path d="M-41 -9 L21 17 M-21 -17 L41 9 M0 -26 L62 0" fill="none"/>
      <path d="M41 -9 L-21 17 M21 -17 L-41 9 M0 -26 L-62 0" fill="none"/>
    </g>
  </g></g>
  <g transform="translate(0,2)"><g class="layer l2">
    <path d="M-62 0 L0 -26 L62 0 L0 26 Z" fill="url(#dem)"/>
    <path d="M-30 -2 C -14 -16 16 -12 34 2 C 16 10 -12 12 -30 -2 Z" fill="#fbf6f6" opacity="0.35"/>
  </g></g>
  <g transform="translate(0,-30)"><g class="layer">
    <clipPath id="clip2"><path d="M-62 0 L0 -26 L62 0 L0 26 Z"/></clipPath>
    <g clip-path="url(#clip2)">
      <path d="M-62 0 L0 -26 L62 0 L0 26 Z" fill="url(#mud)"/>
      <path d="M-62 0 L-20 -18 L62 8 L62 26 L-62 26 Z" fill="url(#marsh)"/>
      <path d="M-62 -6 L0 -32 L20 -22 L-46 4 Z" fill="url(#sea)"/>
      <path d="M-58 8 L30 -12" stroke="#15463f" stroke-width="4" stroke-linecap="round" fill="none"/>
    </g>
  </g></g>
  <!-- alignment axis -->
  <path d="M0 -66 L0 66" stroke="#e29578" stroke-width="2.5" stroke-dasharray="3 7" stroke-linecap="round"/>
</g>
<text class="step" x="401" y="280" text-anchor="middle">02</text>
<text class="title" x="401" y="312" text-anchor="middle">Map</text>
<text class="desc"  x="401" y="338" text-anchor="middle">Photos become 3D maps</text>

<!-- ============ CARD 3 — CLASSIFY (cx=660) ============ -->
<rect x="554" y="28" width="212" height="212" rx="20" fill="#fbf6f6" stroke="#ede0d4" stroke-width="2" filter="url(#cardshadow)"/>
<g transform="translate(660,128)">
  <clipPath id="clip3"><rect x="-70" y="-58" width="140" height="116" rx="8"/></clipPath>
  <g clip-path="url(#clip3)">
    <rect x="-70" y="-58" width="140" height="116" fill="url(#mud)"/>
    <path class="patch p1" d="M-70 -58 L70 -58 L70 -34 L-70 -16 Z" fill="url(#sea)"/>
    <path class="patch p2" d="M-70 34 L70 12 L70 58 L-70 58 Z" fill="url(#marsh)"/>
    <path class="patch p3" d="M-70 40 L70 18 L70 26 L-70 48 Z" fill="#15463f"/>
    <g class="patch p4" fill="#4f9e8e">
      <ellipse cx="-34" cy="20" rx="11" ry="5"/><ellipse cx="6" cy="12" rx="8" ry="4"/><ellipse cx="44" cy="4" rx="10" ry="4"/>
    </g>
    <g class="patch p5" fill="#7a8c2e">
      <ellipse cx="-20" cy="-4" rx="9" ry="4"/><ellipse cx="30" cy="-14" rx="7" ry="3"/>
    </g>
    <!-- classification sweep -->
    <g class="scan">
      <rect x="-3" y="-58" width="6" height="116" fill="#e29578" opacity="0.28"/>
      <path d="M0 -58 L0 58" stroke="#e29578" stroke-width="2.5"/>
    </g>
  </g>
  <rect x="-70" y="-58" width="140" height="116" rx="8" fill="none" stroke="#006d77" stroke-width="3"/>
  <!-- AI chip badge -->
  <g transform="translate(58,-52)">
    <rect x="-16" y="-13" width="32" height="26" rx="6" fill="#006d77"/>
    <circle cx="-6" cy="-3" r="2.6" fill="#bfe0d6"/><circle cx="6" cy="-3" r="2.6" fill="#bfe0d6"/><circle cx="0" cy="7" r="2.6" fill="#bfe0d6"/>
    <path d="M-6 -3 L0 7 L6 -3" stroke="#83c5be" stroke-width="1.8" fill="none"/>
  </g>
</g>
<text class="step" x="660" y="280" text-anchor="middle">03</text>
<text class="title" x="660" y="312" text-anchor="middle">Classify</text>
<text class="desc"  x="660" y="338" text-anchor="middle">AI labels every pixel</text>

<!-- ============ CARD 4 — COMPARE (cx=919) ============ -->
<rect x="813" y="28" width="212" height="212" rx="20" fill="#fbf6f6" stroke="#ede0d4" stroke-width="2" filter="url(#cardshadow)"/>
<g transform="translate(919,128)">
  <!-- browser frame -->
  <rect x="-80" y="-64" width="160" height="122" rx="10" fill="#ffffff" stroke="#ede0d4" stroke-width="2.5"/>
  <g fill="#ede0d4"><circle cx="-66" cy="-52" r="3.5"/><circle cx="-54" cy="-52" r="3.5"/><circle cx="-42" cy="-52" r="3.5"/></g>
  <clipPath id="clip4"><rect x="-72" y="-40" width="144" height="86" rx="6"/></clipPath>
  <g clip-path="url(#clip4)">
    <!-- before: winter, bare mudflat -->
    <rect x="-72" y="-40" width="144" height="86" fill="url(#mud)"/>
    <path d="M-72 -40 L72 -40 L72 -26 L-72 -12 Z" fill="url(#sea)"/>
    <path d="M-72 34 L72 16 L72 46 L-72 46 Z" fill="#88c8b9"/>
    <!-- after: two years later, marsh has spread -->
    <g class="after">
      <rect x="-72" y="-40" width="144" height="86" fill="url(#mud)"/>
      <path d="M-72 -40 L72 -40 L72 -30 L-72 -18 Z" fill="url(#sea)"/>
      <path d="M-72 16 L72 -4 L72 46 L-72 46 Z" fill="url(#marsh)"/>
      <g fill="#4f9e8e"><ellipse cx="-30" cy="2" rx="12" ry="5"/><ellipse cx="18" cy="-8" rx="9" ry="4"/><ellipse cx="52" cy="-16" rx="7" ry="3"/></g>
    </g>
    <!-- swipe divider -->
    <g class="swipe">
      <path d="M0 -42 L0 48" stroke="#fbf6f6" stroke-width="3.5"/>
      <circle cx="0" cy="2" r="9" fill="#006d77"/>
      <path d="M-4.5 2 L4.5 2 M-4.5 2 L-2 -0.5 M-4.5 2 L-2 4.5 M4.5 2 L2 -0.5 M4.5 2 L2 4.5" stroke="#fbf6f6" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </g>
  <!-- timeline slider -->
  <path d="M-58 66 L58 66" stroke="#9ad2c4" stroke-width="4" stroke-linecap="round"/>
  <circle cx="-58" cy="66" r="6" fill="#006d77"/>
  <circle class="swipe" cx="0" cy="66" r="6" fill="#e29578"/>
</g>
<text class="step" x="919" y="280" text-anchor="middle">04</text>
<text class="title" x="919" y="312" text-anchor="middle">Compare</text>
<text class="desc"  x="919" y="338" text-anchor="middle">Change jumps out</text>
</svg>
