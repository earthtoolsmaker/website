<!-- build technology that matters — support / partner CTA (mimics the support page cta-band) -->
<div class="container">
  <div class="support__cta-band build-cta {{ .class }} animate">
    <div class="support__cta-band-text">
      <p class="support__cta-band-eyebrow">Support our work</p>
      <h3 class="support__cta-band-title">Help us build technology <span><i>that matters</i></span></h3>
      <p class="support__cta-band-description">Support our work or partner with us, and help bring conservation technology to the field teams who need it.</p>
    </div>
    <div class="support__cta-band-buttons">
      <a class="link-no-decoration" href="/support/">
        <button class="button">Support our work <i class="fa-solid fa-arrow-right"></i></button>
      </a>
      <a class="link-no-decoration" href="/contact/">
        <button class="button button--ghost">Partner with us <i class="fa-solid fa-chevron-right"></i></button>
      </a>
    </div>
  </div>
</div>
